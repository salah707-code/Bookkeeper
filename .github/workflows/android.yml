name: Android Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Prepare Keystore and Environment
        run: |
          touch .env
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "debug.keystore" ]; then
            cp ~/.android/debug.keystore ./debug.keystore
          fi
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Decode Release Keystore (if Secret Provided)
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > /tmp/release-keystore.jks

      - name: Clean Project
        run: ./gradlew clean --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bookkeeper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Build Release Bundle (AAB)
        if: env.STORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        env:
          KEYSTORE_PATH: /tmp/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Release Bundle Artifact
        if: env.STORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeper-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
