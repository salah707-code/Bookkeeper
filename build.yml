# Mizan Android CI Configuration
name: Mizan Build & Test Pipeline
version: 1.0.0

project:
  name: Mizan
  package: com.example
  platform: Android
  language: Kotlin
  framework: Jetpack Compose
  minSdk: 26
  targetSdk: 36
  compileSdk: 36

pipeline:
  triggers:
    - push
    - pull_request
    - manual

  environment:
    java_version: "17"
    gradle_distribution: "temurin"

  stages:
    - name: Lint & Static Analysis
      command: gradle lintDebug

    - name: Unit Tests
      command: gradle testDebugUnitTest

    - name: Build APK
      command: gradle assembleDebug

artifacts:
  apk_path: "app/build/outputs/apk/debug/app-debug.apk"
